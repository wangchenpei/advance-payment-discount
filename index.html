<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>预缴保费节省计算器</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>预缴保费：实际一次性应交金额</h1>
      </header>

      <main class="card">
        <section class="form">
          <label class="field">
            <span>总名义保费（元）<span class="hint">（千位逗号随输入显示）</span></span>
            <input
              id="nominal"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              spellcheck="false"
              value="1,000,000"
            />
          </label>
          <label class="field">
            <span>原始分期年数 <span class="hint">（每年缴相同金额）</span></span>
            <input id="years" type="number" min="1" step="1" value="5" />
          </label>
          <div class="field field--block">
            <span>各年计息利率 <span class="hint">（共 <span id="ratesCountHint">4</span> 个，单位为每年百分比）</span></span>
            <div class="ratesRow">
              <p id="ratesSummary" class="ratesSummary">第 1 年 5% · 第 2 年 4% · 第 3 年 3% · 第 4 年 2%</p>
              <button type="button" id="openRatesModal" class="btn btn--secondary">填写各年利率…</button>
            </div>
          </div>
          <button type="button" id="calc" class="btn">计算</button>
        </section>

        <section id="error" class="error" hidden></section>

        <section id="result" class="result" hidden>
          <h2>结果</h2>
          <dl class="kv">
            <dt>每期名义保费</dt>
            <dd id="outInstallment"></dd>
            <dt>客户实际一次性应交</dt>
            <dd id="outLump" class="highlight"></dd>
            <dt>相对名义总保费节省</dt>
            <dd id="outSave"></dd>
            <dt>节省÷名义总保费÷年数</dt>
            <dd id="outSavePerNominalPerYear"></dd>
          </dl>
          <p id="outWarn" class="warn" hidden></p>
          <details class="ledger">
            <summary>逐年账户推演（验算）</summary>
            <div id="outSteps" class="steps"></div>
          </details>
        </section>
      </main>

      <footer class="footer">
        <p>算法说明：每期保费 <span class="mono">P = 名义总额 / 年数</span>。第 0 期从实缴 <span class="mono">X</span> 扣 <span class="mono">P</span>；之后前 <span class="mono">年数 − 2</span> 个计息年度均为「先按该年利率滚存一年，再扣一期 <span class="mono">P</span>」；最后一个计息年度<strong>只滚存、不再扣</strong> <span class="mono">P</span>，使期末余额<strong>恰好等于</strong>最后一期 <span class="mono">P</span>。共 <span class="mono">年数 − 1</span> 个年利率。由此倒推 <span class="mono">X</span>。</p>
      </footer>
    </div>

    <dialog id="ratesDialog" class="dialog">
      <div class="dialog__panel">
        <h2 class="dialog__title">各年计息利率（%）</h2>
        <p id="ratesDialogHint" class="dialog__hint"></p>
        <div id="ratesDialogFields" class="dialog__fields"></div>
        <div class="dialog__actions">
          <button type="button" id="ratesDialogCancel" class="btn btn--ghost">取消</button>
          <button type="button" id="ratesDialogOk" class="btn">确定</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
